# Repository-level ruff configuration (backend + scripts). Rule selection is explicit so that the
# result does not depend on the ruff version installed in CI.
line-length = 120
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E741"]  # short loop variables (l for link/line) are used deliberately in comprehensions

[lint.isort]
known-first-party = ["appro"]
