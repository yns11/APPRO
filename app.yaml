# =============================================================================
# Manifeste Databricks Apps — APPRO
# -----------------------------------------------------------------------------
# Lu par `databricks apps deploy` (déploiement direct) ; le bundle
# (databricks.yml + resources/appro_app.yml) porte le MÊME bloc `config` : les
# deux doivent rester identiques (vérifié par backend/tests/test_bundle.py).
#
# `main.py` (racine du dépôt) démarre uvicorn sur DATABRICKS_APP_PORT, en
# 0.0.0.0 ; le dossier backend/ est mis sur sys.path par ce même fichier.
# Le frontend compilé (client/dist) DOIT exister avant le déploiement :
# scripts/build.sh (ou scripts/deploy.sh qui compile puis déploie).
#
# Ressource attachée : `postgres` (projet Lakebase). La plateforme injecte
# PGHOST, PGPORT, PGDATABASE, PGUSER, PGSSLMODE ; elle n'injecte PAS
# LAKEBASE_ENDPOINT, qu'il faut réclamer par `valueFrom` (sinon l'application
# démarre puis répond 503 sur toutes les routes : aucun moyen de générer un jeton).
# =============================================================================
command:
  - python
  - main.py

env:
  # --- Lakebase : base applicative + miroir des faits ERP -------------------
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  # Repli si LAKEBASE_ENDPOINT n'est pas résolu : l'application retrouve son
  # endpoint en listant ceux de la branche et en comparant PGHOST.
  - name: APPRO_LAKEBASE_BRANCH
    value: "projects/appro/branches/production"
  # Rôle Postgres de l'identité qui exécute le job de synchronisation
  # (adresse e-mail Databricks ou client_id d'un principal de service) : reçoit
  # les droits d'écriture sur les tables erp_* au démarrage de l'application.
  - name: APPRO_SYNC_ROLE
    value: "prenom.nom@exemple.com"

  # --- Source des faits ERP -------------------------------------------------
  # lakebase : tables erp_* de la base applicative, alimentées par le job
  # uc       : lecture directe des extractions par un SQL warehouse (ressource
  #            sql-warehouse à attacher, DATABRICKS_WAREHOUSE_ID valueFrom)
  - name: APPRO_DATA_SOURCE
    value: "lakebase"
  - name: APPRO_UC_CATALOG
    value: "emotors_data_champions"
  - name: APPRO_UC_SCHEMA
    value: "silver_erp_ye"
  - name: APPRO_ERP_ORDERS_TABLE
    value: "commandes_edi"
  - name: APPRO_ERP_RECEIPTS_TABLE
    value: "recep_edi"

  # --- Règles par défaut (identiques aux défauts du code) --------------------
  - name: APPRO_HORIZON_DAYS
    value: "120"
  - name: APPRO_HISTORY_DAYS
    value: "14"
  - name: APPRO_LOG_LEVEL
    value: "INFO"
