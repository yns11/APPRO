# Databricks Apps runtime configuration (used by `databricks apps deploy`).
# The frontend is built by scripts/build.sh before upload; start.sh builds it on the fly only if
# client/dist is missing (Node.js is available in the Databricks Apps runtime).
command:
  - bash
  - start.sh
env:
  - name: APPRO_DATA_SOURCE
    value: "lakebase"                # "lakebase": UC synced tables in the app database ; "uc": SQL warehouse ; "local": seed CSV (demo)
  - name: APPRO_LAKEBASE_SCHEMA
    value: "appro_erp"               # PostgreSQL schema of the synced tables
  - name: APPRO_UC_CATALOG
    value: "main"                    # mode "uc" only
  - name: APPRO_UC_SCHEMA
    value: "appro"
  # - name: DATABRICKS_WAREHOUSE_ID  # mode "uc" only: SQL warehouse resource attached to the app (CAN_USE)
  #   valueFrom: sql-warehouse
  - name: PGHOST                     # Lakebase resource ("database") – app store and synced tables
    valueFrom: database
  - name: APPRO_HORIZON_DAYS
    value: "120"
  - name: APPRO_LOG_LEVEL
    value: "INFO"
